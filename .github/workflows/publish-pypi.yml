name: Publish to PyPI

# Python SDK only, from python/. Uses PyPI trusted publishing (OIDC): register
# this repository + workflow file as a trusted publisher for the project
# "knowshowgo-client" on pypi.org once; no token secret is needed after that.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish knowshowgo-client
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build requests
      - run: python -m unittest discover -s python/tests -p 'test_*.py'
      - run: python -m build --outdir dist-py python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py
