name: Publish to NPM

# JS SDK only. The Python SDK publishes from publish-pypi.yml on the same tag.
# npm publish must never depend on python3: `npm test` runs the js/*.test.mjs
# suites, and python/ is not in the tarball (see package.json files).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish @lehelkovach/knowshowgo-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - run: npm run build
      # --access public is required for the @lehelkovach scope (client #65).
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
