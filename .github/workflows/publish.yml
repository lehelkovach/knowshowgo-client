name: Publish to NPM

# JS SDK only. The Python SDK publishes from publish-pypi.yml on the same tag.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish @lehelkovach/knowshowgo-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
