name: CI

# Manual only (2026-10-26). GitHub runs nothing by itself in this stack any
# more (the founder, 2026-10-23: cut Actions out, cost as little as possible;
# knowshowgo #325 did the same there). The suites run locally before a merge
# (`npm run test:all`). On 2026-10-26 every job of this workflow failed in two
# seconds with no log on the PR and on the `dev` push — the runner never
# started — and painted a green change red.
on:
  workflow_dispatch:

jobs:
  js:
    name: JS (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack and import
        run: |
          npm pack
          mkdir -p /tmp/ksg-pack-smoke
          cd /tmp/ksg-pack-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/lehelkovach-knowshowgo-client-*.tgz
          node --input-type=module -e "import('@lehelkovach/knowshowgo-client').then(m => { if (!m.KnowShowGoClient) process.exit(1); console.log('import ok'); })"

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e python
      - run: python -m unittest discover -s python/tests -p 'test_*.py'
