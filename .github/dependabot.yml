# Weekly dependency PRs, grouped so a solo maintainer sees one PR per
# ecosystem, not twenty. Security updates arrive as soon as GitHub knows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: dev
    open-pull-requests-limit: 3
    groups:
      production: { dependency-type: production }
      development: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: dev
  - package-ecosystem: pip
    directory: /python
    schedule: { interval: weekly, day: monday }
    target-branch: dev
